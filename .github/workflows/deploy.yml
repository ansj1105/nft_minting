name: Deploy NFT Minter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nft-minting-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run validate:ecr-deploy
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run lint:secrets

  build_push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      region: ${{ steps.delivery.outputs.region }}
      role_arn: ${{ steps.delivery.outputs.role_arn }}
      deployer_role_arn: ${{ steps.delivery.outputs.deployer_role_arn }}
      registry: ${{ steps.delivery.outputs.registry }}
      repository: ${{ steps.delivery.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve delivery config
        id: delivery
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('deploy/ecr-images.json', 'utf8'));
          const image = manifest.images.find((entry) => entry.key === 'nft-minting');
          if (!image) throw new Error('nft-minting image definition is missing');
          const values = {
            region: manifest.awsRegion,
            role_arn: `arn:aws:iam::${manifest.accountId}:role/${manifest.publisherRoleName}`,
            deployer_role_arn: `arn:aws:iam::${manifest.accountId}:role/${manifest.deployerRoleName}`,
            registry: `${manifest.accountId}.dkr.ecr.${manifest.awsRegion}.amazonaws.com`,
            repository: image.repository,
            context: image.context,
            dockerfile: image.dockerfile,
            platform: image.platform,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => `${key}=${value}`).join('\n') + '\n');
          NODE
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.delivery.outputs.role_arn }}
          aws-region: ${{ steps.delivery.outputs.region }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.delivery.outputs.context }}
          file: ${{ steps.delivery.outputs.dockerfile }}
          platforms: ${{ steps.delivery.outputs.platform }}
          provenance: false
          push: true
          tags: ${{ steps.delivery.outputs.registry }}/${{ steps.delivery.outputs.repository }}:candidate-${{ github.sha }}

  deploy:
    needs: build_push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ needs.build_push.outputs.deployer_role_arn }}
          aws-region: ${{ needs.build_push.outputs.region }}
      - name: Deploy exact digest to Amoy and Sepolia
        env:
          IMAGE_URI: ${{ needs.build_push.outputs.registry }}/${{ needs.build_push.outputs.repository }}@${{ needs.build_push.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          ECR_CONFIG: deploy/ecr-images.json
        run: bash scripts/deploy-via-ssm.sh
